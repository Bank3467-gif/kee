<html lang="th">

        body {

            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #120e24;
            border: 1px solid #231b42;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #7b7593;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #8c85a6;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #090712;
            border: 1px solid #261f47;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #7a52f4;
        }

        .delete-group {
            display: flex;
            gap: 8px;
        }

        .btn-delete {
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #8a44ff, #4a75ff);

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }
